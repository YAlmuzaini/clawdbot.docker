services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_OPENCLAW
      - SERVICE_URL_OPENCLAW_18789
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-auto}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - SERVICE_PASSWORD_OPENCLAW=${SERVICE_PASSWORD_OPENCLAW}
      - OPENCLAW_GATEWAY_TOKEN=${SERVICE_PASSWORD_OPENCLAW}
      - XDG_CONFIG_HOME=/home/node/.openclaw
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./openclaw-config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./openclaw-workspace}:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command:
      [
        "node",
        "dist/index.mjs",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-auto}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}",
        "--allow-unconfigured",
      ]
    healthcheck:
      test: ["CMD", "node", "dist/index.mjs", "health", "--token", "$$OPENCLAW_GATEWAY_TOKEN"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:main
    container_name: openclaw-cli
    profiles:
      - cli
    environment:
      - HOME=/home/node
      - XDG_CONFIG_HOME=/home/node/.openclaw
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./openclaw-config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./openclaw-workspace}:/home/node/.openclaw/workspace
    entrypoint: ["/bin/sh"]
    command: ["-c", "echo 'Use: docker compose run --rm openclaw-cli <command>'"]
