# documentation: https://docs.openclaw.ai/install/docker
# slogan: AI-powered multi-channel messaging gateway with agent sandboxing
# tags: ai,chatbot,gateway,whatsapp,telegram,discord,llm,agent
# logo: svgs/openclaw-logo-text.svg
# port: 18789

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    environment:
      - SERVICE_FQDN_OPENCLAW
      - SERVICE_URL_OPENCLAW_18789
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_BIND=auto
      - OPENCLAW_GATEWAY_PORT=18789
      - SERVICE_PASSWORD_OPENCLAW=${SERVICE_PASSWORD_OPENCLAW}
      - OPENCLAW_GATEWAY_TOKEN=${SERVICE_PASSWORD_OPENCLAW}
      - XDG_CONFIG_HOME=/home/node/.openclaw
    volumes:
      - type: bind
        source: ./openclaw-config
        target: /home/node/.openclaw
        is_directory: true
      - type: bind
        source: ./openclaw-workspace
        target: /home/node/.openclaw/workspace
        is_directory: true
    command:
      [
        "node",
        "dist/index.mjs",
        "gateway",
        "--bind",
        "auto",
        "--port",
        "18789",
        "--allow-unconfigured",
      ]
    healthcheck:
      test: ["CMD", "node", "dist/index.mjs", "health", "--token", "$$OPENCLAW_GATEWAY_TOKEN"]
      interval: 30s
      timeout: 10s
      retries: 3
